name: Build beta installers

on:
  workflow_dispatch:
  push:
    branches: [codex/browsor-2-design]

permissions:
  contents: read

concurrency:
  group: browsor-beta-installers
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: packaging
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: app
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install build dependencies
        run: python -m pip install -r app/requirements-build.txt
      - name: Build native app and DMG
        run: python packaging/scripts/build_macos.py --source app
      - name: Check packaged Mac application startup
        run: python packaging/scripts/check_installer_startup.py app/dist/BROWSOR-2.0.0-beta.2-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: startup-macos-${{ matrix.arch }}
          path: startup-report/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: app/dist/*.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows setup EXE
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: packaging
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: app
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r app/requirements-build.txt
      - name: Build application
        working-directory: app
        run: python scripts/build_windows.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compilerPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compilerPath)) { throw "Inno Setup is not available on this runner" }
          $sourceRoot = (Resolve-Path -LiteralPath app).Path
          & $compilerPath "/DSourceRoot=$sourceRoot" packaging/scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Check installed Windows application startup
        run: python packaging/scripts/check_installer_startup.py app/dist/BROWSOR-2.0.0-beta.2-windows-x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: startup-windows
          path: startup-report/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: app/dist/*-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

