name: Build beta installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsor-beta-installers
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: packaging
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: d920d45bb88949720c99e89bb292d63f07939a7b # v1.0.0-beta.1 application
          path: app
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install build dependencies
        run: python -m pip install -r app/requirements-build.txt
      - name: Build native app and DMG
        run: python packaging/scripts/build_macos.py --source app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: app/dist/*.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows setup EXE
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: packaging
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: d920d45bb88949720c99e89bb292d63f07939a7b
          path: app
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r app/requirements-build.txt
      - name: Build application
        working-directory: app
        run: python scripts/build_windows.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compilerPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compilerPath)) { throw "Inno Setup is not available on this runner" }
          $sourceRoot = (Resolve-Path -LiteralPath app).Path
          & $compilerPath "/DSourceRoot=$sourceRoot" packaging/scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: app/dist/*-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Add installers to the existing beta
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true
      - name: Upload installers and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_installers.py installers
